<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>考试倒计时小工具</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow: hidden;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
            background-size: 400% 400%;
            animation: gradientShift 15s ease infinite;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        #particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: rgba(255, 255, 255, 0.6);
            border-radius: 50%;
            animation: float 10s infinite ease-in-out;
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0) translateX(0);
                opacity: 0.6;
            }
            50% {
                transform: translateY(-50px) translateX(20px);
                opacity: 0.3;
            }
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 25px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
            max-width: 600px;
            width: 100%;
            position: relative;
            z-index: 1;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-size: 28px;
            font-weight: 700;
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .input-section {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 30px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .input-group label {
            font-weight: 600;
            color: #555;
            font-size: 14px;
        }

        .input-group input {
            padding: 14px 18px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 16px;
            transition: all 0.3s;
            background: #f8f9fa;
        }

        .input-group input:focus {
            outline: none;
            border-color: #667eea;
            background: white;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .time-inputs {
            display: flex;
            gap: 12px;
        }

        .time-inputs .input-group {
            flex: 1;
        }

        button {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
        }

        button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            transition: left 0.5s;
        }

        button:hover::before {
            left: 100%;
        }

        .btn-set {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-set:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
        }

        .btn-pause {
            background: linear-gradient(135deg, #ff9800, #f57c00);
            color: white;
            box-shadow: 0 4px 15px rgba(255, 152, 0, 0.4);
        }

        .btn-pause:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 152, 0, 0.6);
        }

        .btn-reset {
            background: linear-gradient(135deg, #f44336, #d32f2f);
            color: white;
            box-shadow: 0 4px 15px rgba(244, 67, 54, 0.4);
        }

        .btn-reset:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(244, 67, 54, 0.6);
        }

        .btn-group {
            display: flex;
            gap: 12px;
            margin-top: 12px;
        }

        .btn-group button {
            flex: 1;
        }

        .countdown-section {
            display: none;
            margin-top: 30px;
        }

        .countdown-section.show {
            display: block;
        }

        .countdown {
            display: flex;
            justify-content: space-around;
            margin-top: 20px;
            gap: 10px;
        }

        .countdown-item {
            text-align: center;
            background: linear-gradient(145deg, #f8f9fa, #ffffff);
            padding: 25px 15px;
            border-radius: 20px;
            min-width: 80px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
            transition: transform 0.3s, box-shadow 0.3s;
            position: relative;
            overflow: hidden;
        }

        .countdown-item:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.12);
        }

        .countdown-number {
            font-size: 42px;
            font-weight: 700;
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1.2;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.05);
            }
        }

        .countdown-label {
            font-size: 13px;
            color: #888;
            margin-top: 8px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .status-message {
            text-align: center;
            margin-top: 25px;
            color: #666;
            font-size: 15px;
            padding: 12px;
            border-radius: 10px;
            background: #f8f9fa;
        }

        .status-message.running {
            color: #4CAF50;
            background: rgba(76, 175, 80, 0.1);
            border: 1px solid rgba(76, 175, 80, 0.3);
        }

        .status-message.paused {
            color: #ff9800;
            background: rgba(255, 152, 0, 0.1);
            border: 1px solid rgba(255, 152, 0, 0.3);
        }

        @media (max-width: 480px) {
            .container {
                padding: 25px;
            }
            
            h1 {
                font-size: 22px;
            }
            
            .countdown {
                gap: 5px;
            }
            
            .countdown-item {
                padding: 18px 10px;
                min-width: 65px;
            }
            
            .countdown-number {
                font-size: 30px;
            }
            
            .countdown-label {
                font-size: 11px;
            }
        }
    </style>
</head>
<body>
    <div id="particles"></div>
    <div class="container">
        <h1>📚 考试倒计时</h1>
        
        <div class="input-section">
            <div class="input-group">
                <label for="examDate">考试日期</label>
                <input type="date" id="examDate" required>
            </div>
            <div class="time-inputs">
                <div class="input-group">
                    <label for="examHour">小时</label>
                    <input type="number" id="examHour" min="0" max="23" placeholder="0-23" required>
                </div>
                <div class="input-group">
                    <label for="examMinute">分钟</label>
                    <input type="number" id="examMinute" min="0" max="59" placeholder="0-59" required>
                </div>
            </div>
            <button class="btn-set" id="btnSet">开始倒计时</button>
        </div>

        <div class="countdown-section" id="countdownSection">
            <div class="countdown">
                <div class="countdown-item">
                    <div class="countdown-number" id="days">00</div>
                    <div class="countdown-label">天</div>
                </div>
                <div class="countdown-item">
                    <div class="countdown-number" id="hours">00</div>
                    <div class="countdown-label">时</div>
                </div>
                <div class="countdown-item">
                    <div class="countdown-number" id="minutes">00</div>
                    <div class="countdown-label">分</div>
                </div>
                <div class="countdown-item">
                    <div class="countdown-number" id="seconds">00</div>
                    <div class="countdown-label">秒</div>
                </div>
            </div>
            <div class="btn-group">
                <button class="btn-pause" id="btnPause">暂停</button>
                <button class="btn-reset" id="btnReset">重置</button>
            </div>
            <div class="status-message" id="statusMessage">倒计时运行中...</div>
        </div>
    </div>

    <script>
        const examDateInput = document.getElementById('examDate');
        const examHourInput = document.getElementById('examHour');
        const examMinuteInput = document.getElementById('examMinute');
        const btnSet = document.getElementById('btnSet');
        const btnPause = document.getElementById('btnPause');
        const btnReset = document.getElementById('btnReset');
        const countdownSection = document.getElementById('countdownSection');
        const daysEl = document.getElementById('days');
        const hoursEl = document.getElementById('hours');
        const minutesEl = document.getElementById('minutes');
        const secondsEl = document.getElementById('seconds');
        const statusMessage = document.getElementById('statusMessage');
        const particlesContainer = document.getElementById('particles');

        let countdownInterval = null;
        let examTime = null;
        let isPaused = false;
        let remainingTime = 0;

        function createParticles() {
            for (let i = 0; i < 50; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.top = Math.random() * 100 + '%';
                particle.style.animationDelay = Math.random() * 10 + 's';
                particle.style.animationDuration = (8 + Math.random() * 4) + 's';
                particle.style.width = (2 + Math.random() * 4) + 'px';
                particle.style.height = particle.style.width;
                particlesContainer.appendChild(particle);
            }
        }

        function updateCountdown() {
            if (isPaused) return;

            const now = Date.now();
            remainingTime = examTime - now;

            if (remainingTime <= 0) {
                clearInterval(countdownInterval);
                updateDisplay(0, 0, 0, 0);
                statusMessage.textContent = '考试时间到！';
                statusMessage.className = 'status-message';
                return;
            }

            const days = Math.floor(remainingTime / (1000 * 60 * 60 * 24));
            const hours = Math.floor((remainingTime % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((remainingTime % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((remainingTime % (1000 * 60)) / 1000);

            updateDisplay(days, hours, minutes, seconds);
        }

        function updateDisplay(days, hours, minutes, seconds) {
            animateNumber(daysEl, String(days).padStart(2, '0'));
            animateNumber(hoursEl, String(hours).padStart(2, '0'));
            animateNumber(minutesEl, String(minutes).padStart(2, '0'));
            animateNumber(secondsEl, String(seconds).padStart(2, '0'));
        }

        function animateNumber(element, newValue) {
            if (element.textContent !== newValue) {
                element.style.transform = 'scale(1.2)';
                element.style.opacity = '0.7';
                setTimeout(() => {
                    element.textContent = newValue;
                    element.style.transform = 'scale(1)';
                    element.style.opacity = '1';
                }, 100);
            }
        }

        btnSet.addEventListener('click', () => {
            const date = examDateInput.value;
            const hour = parseInt(examHourInput.value);
            const minute = parseInt(examMinuteInput.value);

            if (!date || isNaN(hour) || isNaN(minute)) {
                alert('请输入有效的日期和时间');
                return;
            }

            const [year, month, day] = date.split('-').map(Number);
            examTime = new Date(year, month - 1, day, hour, minute, 0, 0).getTime();

            const now = Date.now();
            if (examTime <= now) {
                alert('考试时间必须在未来');
                return;
            }

            isPaused = false;
            remainingTime = examTime - now;
            
            countdownSection.classList.add('show');
            statusMessage.textContent = '倒计时运行中...';
            statusMessage.className = 'status-message running';
            
            clearInterval(countdownInterval);
            updateCountdown();
            countdownInterval = setInterval(updateCountdown, 1000);
        });

        btnPause.addEventListener('click', () => {
            isPaused = !isPaused;
            if (isPaused) {
                btnPause.textContent = '继续';
                statusMessage.textContent = '倒计时已暂停';
                statusMessage.className = 'status-message paused';
            } else {
                btnPause.textContent = '暂停';
                statusMessage.textContent = '倒计时运行中...';
                statusMessage.className = 'status-message running';
            }
        });

        btnReset.addEventListener('click', () => {
            clearInterval(countdownInterval);
            countdownSection.classList.remove('show');
            examDateInput.value = '';
            examHourInput.value = '';
            examMinuteInput.value = '';
            isPaused = false;
            examTime = null;
            updateDisplay(0, 0, 0, 0);
        });

        createParticles();
    </script>
</body>
</html>
