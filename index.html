<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>考试倒计时小工具</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f5f5f5;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
            max-width: 600px;
            width: 100%;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-size: 28px;
        }

        .input-section {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 30px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .input-group label {
            font-weight: 600;
            color: #555;
            font-size: 14px;
        }

        .input-group input {
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        .input-group input:focus {
            outline: none;
            border-color: #4CAF50;
        }

        .time-inputs {
            display: flex;
            gap: 10px;
        }

        .time-inputs .input-group {
            flex: 1;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-set {
            background-color: #4CAF50;
            color: white;
        }

        .btn-set:hover {
            background-color: #45a049;
        }

        .btn-pause {
            background-color: #ff9800;
            color: white;
        }

        .btn-pause:hover {
            background-color: #f57c00;
        }

        .btn-reset {
            background-color: #f44336;
            color: white;
        }

        .btn-reset:hover {
            background-color: #d32f2f;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        .btn-group button {
            flex: 1;
        }

        .countdown-section {
            display: none;
            margin-top: 30px;
        }

        .countdown-section.show {
            display: block;
        }

        .countdown {
            display: flex;
            justify-content: space-around;
            margin-top: 20px;
        }

        .flip-card {
            perspective: 400px;
            min-width: 80px;
        }

        .flip-card-inner {
            position: relative;
            width: 100%;
            height: 80px;
            text-align: center;
            transition: transform 0.6s;
            transform-style: preserve-3d;
        }

        .flip-card-inner.flipping {
            animation: flip 0.6s ease-in-out;
        }

        @keyframes flip {
            0% { transform: rotateX(0deg); }
            50% { transform: rotateX(-90deg); }
            100% { transform: rotateX(0deg); }
        }

        .flip-card-front,
        .flip-card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(145deg, #f0f0f0, #ffffff);
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }

        .flip-card-back {
            transform: rotateX(180deg);
        }

        .flip-card-inner.flipping .flip-card-front {
            animation: flipFront 0.6s ease-in-out;
        }

        .flip-card-inner.flipping .flip-card-back {
            animation: flipBack 0.6s ease-in-out;
        }

        @keyframes flipFront {
            0% { transform: rotateX(0deg); }
            100% { transform: rotateX(-90deg); }
        }

        @keyframes flipBack {
            0% { transform: rotateX(90deg); }
            100% { transform: rotateX(0deg); }
        }

        .flip-number {
            font-size: 42px;
            font-weight: 700;
            color: #333;
            line-height: 1.2;
        }

        .countdown-label {
            text-align: center;
            font-size: 12px;
            color: #888;
            margin-top: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .status-message {
            text-align: center;
            margin-top: 20px;
            color: #666;
            font-size: 14px;
        }

        .status-message.running {
            color: #4CAF50;
        }

        .status-message.paused {
            color: #ff9800;
        }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            animation: fadeIn 0.3s ease;
        }

        .modal-overlay.show {
            display: flex;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal-content {
            background: white;
            border-radius: 20px;
            padding: 40px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            animation: slideUp 0.4s ease;
            max-width: 400px;
            width: 90%;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .modal-content h2 {
            color: #f44336;
            margin-bottom: 15px;
            font-size: 24px;
        }

        .modal-content p {
            color: #666;
            margin-bottom: 20px;
        }

        .modal-content button {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
        }

        @media (max-width: 480px) {
            .container {
                padding: 25px;
            }
            
            h1 {
                font-size: 22px;
            }
            
            .flip-card {
                min-width: 60px;
            }
            
            .flip-card-inner {
                height: 65px;
            }
            
            .flip-number {
                font-size: 32px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📚 考试倒计时</h1>
        
        <div class="input-section">
            <div class="input-group">
                <label for="examDate">考试日期</label>
                <input type="date" id="examDate" required>
            </div>
            <div class="time-inputs">
                <div class="input-group">
                    <label for="examHour">小时</label>
                    <input type="number" id="examHour" min="0" max="23" placeholder="0-23" required>
                </div>
                <div class="input-group">
                    <label for="examMinute">分钟</label>
                    <input type="number" id="examMinute" min="0" max="59" placeholder="0-59" required>
                </div>
            </div>
            <button class="btn-set" id="btnSet">开始倒计时</button>
        </div>

        <div class="countdown-section" id="countdownSection">
            <div class="countdown">
                <div class="flip-card">
                    <div class="flip-card-inner" id="daysCard">
                        <div class="flip-card-front">
                            <span class="flip-number" id="daysFront">00</span>
                        </div>
                        <div class="flip-card-back">
                            <span class="flip-number" id="daysBack">00</span>
                        </div>
                    </div>
                    <div class="countdown-label">天</div>
                </div>
                <div class="flip-card">
                    <div class="flip-card-inner" id="hoursCard">
                        <div class="flip-card-front">
                            <span class="flip-number" id="hoursFront">00</span>
                        </div>
                        <div class="flip-card-back">
                            <span class="flip-number" id="hoursBack">00</span>
                        </div>
                    </div>
                    <div class="countdown-label">时</div>
                </div>
                <div class="flip-card">
                    <div class="flip-card-inner" id="minutesCard">
                        <div class="flip-card-front">
                            <span class="flip-number" id="minutesFront">00</span>
                        </div>
                        <div class="flip-card-back">
                            <span class="flip-number" id="minutesBack">00</span>
                        </div>
                    </div>
                    <div class="countdown-label">分</div>
                </div>
                <div class="flip-card">
                    <div class="flip-card-inner" id="secondsCard">
                        <div class="flip-card-front">
                            <span class="flip-number" id="secondsFront">00</span>
                        </div>
                        <div class="flip-card-back">
                            <span class="flip-number" id="secondsBack">00</span>
                        </div>
                    </div>
                    <div class="countdown-label">秒</div>
                </div>
            </div>
            <div class="btn-group">
                <button class="btn-pause" id="btnPause">暂停</button>
                <button class="btn-reset" id="btnReset">重置</button>
            </div>
            <div class="status-message" id="statusMessage">倒计时运行中...</div>
        </div>
    </div>

    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-content">
            <h2>🎉 考试时间到！</h2>
            <p>准备好迎接挑战了吗？祝你考试顺利！</p>
            <button id="btnCloseModal">确定</button>
        </div>
    </div>

    <script>
        const examDateInput = document.getElementById('examDate');
        const examHourInput = document.getElementById('examHour');
        const examMinuteInput = document.getElementById('examMinute');
        const btnSet = document.getElementById('btnSet');
        const btnPause = document.getElementById('btnPause');
        const btnReset = document.getElementById('btnReset');
        const countdownSection = document.getElementById('countdownSection');
        const statusMessage = document.getElementById('statusMessage');
        const modalOverlay = document.getElementById('modalOverlay');
        const btnCloseModal = document.getElementById('btnCloseModal');

        const flipCards = {
            days: {
                card: document.getElementById('daysCard'),
                front: document.getElementById('daysFront'),
                back: document.getElementById('daysBack')
            },
            hours: {
                card: document.getElementById('hoursCard'),
                front: document.getElementById('hoursFront'),
                back: document.getElementById('hoursBack')
            },
            minutes: {
                card: document.getElementById('minutesCard'),
                front: document.getElementById('minutesFront'),
                back: document.getElementById('minutesBack')
            },
            seconds: {
                card: document.getElementById('secondsCard'),
                front: document.getElementById('secondsFront'),
                back: document.getElementById('secondsBack')
            }
        };

        let countdownInterval = null;
        let examTime = null;
        let isPaused = false;
        let remainingTime = 0;
        let lastTime = 0;
        const audioContext = typeof AudioContext !== 'undefined' ? new AudioContext() : null;

        function playNotificationSound() {
            if (!audioContext) return;
            
            const oscillator = audioContext.createOscillator();
            const gainNode = audioContext.createGain();
            
            oscillator.connect(gainNode);
            gainNode.connect(audioContext.destination);
            
            oscillator.frequency.setValueAtTime(800, audioContext.currentTime);
            oscillator.frequency.setValueAtTime(1000, audioContext.currentTime + 0.2);
            oscillator.frequency.setValueAtTime(1200, audioContext.currentTime + 0.4);
            
            gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.6);
            
            oscillator.start(audioContext.currentTime);
            oscillator.stop(audioContext.currentTime + 0.6);
        }

        function showEndModal() {
            modalOverlay.classList.add('show');
            playNotificationSound();
        }

        function flipCard(cardKey, newValue) {
            const card = flipCards[cardKey];
            if (card.front.textContent === newValue) return;

            card.back.textContent = newValue;
            card.card.classList.add('flipping');

            setTimeout(() => {
                card.front.textContent = newValue;
                card.card.classList.remove('flipping');
            }, 300);
        }

        function updateDisplay(days, hours, minutes, seconds) {
            const daysStr = String(days).padStart(2, '0');
            const hoursStr = String(hours).padStart(2, '0');
            const minutesStr = String(minutes).padStart(2, '0');
            const secondsStr = String(seconds).padStart(2, '0');

            flipCard('days', daysStr);
            flipCard('hours', hoursStr);
            flipCard('minutes', minutesStr);
            flipCard('seconds', secondsStr);
        }

        function updateCountdown() {
            if (isPaused) return;

            const now = Date.now();
            
            const timeDiff = now - lastTime;
            if (timeDiff < 950) return;
            
            lastTime = now;
            remainingTime = examTime - now;

            if (remainingTime <= 0) {
                clearInterval(countdownInterval);
                updateDisplay(0, 0, 0, 0);
                statusMessage.textContent = '考试时间到！';
                statusMessage.className = 'status-message';
                showEndModal();
                return;
            }

            const days = Math.floor(remainingTime / (1000 * 60 * 60 * 24));
            const hours = Math.floor((remainingTime % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((remainingTime % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((remainingTime % (1000 * 60)) / 1000);

            updateDisplay(days, hours, minutes, seconds);
        }

        btnSet.addEventListener('click', () => {
            const date = examDateInput.value;
            const hour = parseInt(examHourInput.value);
            const minute = parseInt(examMinuteInput.value);

            if (!date || isNaN(hour) || isNaN(minute)) {
                alert('请输入有效的日期和时间');
                return;
            }

            const [year, month, day] = date.split('-').map(Number);
            examTime = new Date(year, month - 1, day, hour, minute, 0, 0).getTime();

            const now = Date.now();
            if (examTime <= now) {
                alert('考试时间必须在未来');
                return;
            }

            isPaused = false;
            remainingTime = examTime - now;
            lastTime = now;
            
            countdownSection.classList.add('show');
            statusMessage.textContent = '倒计时运行中...';
            statusMessage.className = 'status-message running';
            
            clearInterval(countdownInterval);
            updateCountdown();
            countdownInterval = setInterval(updateCountdown, 100);
        });

        btnPause.addEventListener('click', () => {
            isPaused = !isPaused;
            if (isPaused) {
                btnPause.textContent = '继续';
                statusMessage.textContent = '倒计时已暂停';
                statusMessage.className = 'status-message paused';
            } else {
                lastTime = Date.now();
                btnPause.textContent = '暂停';
                statusMessage.textContent = '倒计时运行中...';
                statusMessage.className = 'status-message running';
            }
        });

        btnReset.addEventListener('click', () => {
            clearInterval(countdownInterval);
            countdownSection.classList.remove('show');
            modalOverlay.classList.remove('show');
            examDateInput.value = '';
            examHourInput.value = '';
            examMinuteInput.value = '';
            isPaused = false;
            examTime = null;
            updateDisplay(0, 0, 0, 0);
        });

        btnCloseModal.addEventListener('click', () => {
            modalOverlay.classList.remove('show');
        });
    </script>
</body>
</html>
